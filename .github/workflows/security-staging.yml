name: Security staging regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [security-hardening-2026-11-09]
permissions:
  contents: read
jobs:
  js-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original customer-facing UI files exactly
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          for f in index.html style.css charts.js; do
            git show origin/main:"$f" | cmp - "$f" || {
              echo "::error file=$f::Frontend layout/markup/style changed. Owner approval required."
              exit 1
            }
          done
      - name: JavaScript syntax
        run: node --check app.js
      - name: Static and mocked hold tests
        run: node --test tests/*.test.cjs
      - name: Build separate static HTTPS staging site (safe payment placeholder)
        shell: bash
        run: |
          python3 staging/scripts/build-static-preview.py
          test -f staging/site-dist/index.html
          test -f staging/site-dist/app.js
          ! grep -q '0894932242' staging/site-dist/index.html
          ! grep -q 'promptpay_qr.png' staging/site-dist/index.html
          cmp app.js staging/site-dist/app.js
          cmp style.css staging/site-dist/style.css
          cmp charts.js staging/site-dist/charts.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('staging/site-dist/index.html').read_text(encoding='utf-8')
          for name in ('custName','custPhone','custEmail','custVehicle'):
              tag=re.search(r'<input\b[^>]*\bid="'+name+r'"[^>]*>',h)
              assert tag is not None and re.search(r'\brequired\b',tag.group(0)), name
          assert 'ทะเบียนรถ *' in h
          assert 'ไม่บังคับ)</label>' not in h
          PY
      - name: Upload independent static staging preview for deployment
        uses: actions/upload-artifact@v4
        with:
          name: grand-slam-staging-static-site
          path: staging/site-dist/
          retention-days: 7
      - name: Netlify staging domain public response diagnostics (read-only)
        shell: bash
        run: |
          base='https://illustrious-alfajores-364eb8.netlify.app'
          status=$(curl --silent --show-error --location --max-time 20 -D /tmp/netlify-response-headers "$base/" -o /tmp/netlify-response-body -w '%{http_code}')
          echo "Netlify HTTP status: $status"
          tr -d '\r' </tmp/netlify-response-headers | grep -iE '^(HTTP/|content-type:|location:)' || true
          if [[ "$status" != "200" ]]; then
            echo "::warning::Netlify site not yet publicly reachable; check Publish/Make public in the Netlify dashboard"
          elif ! grep -q 'The Grand Slam' /tmp/netlify-response-body; then
            echo "::warning::Netlify response is not yet the expected customer UI"
          else
            echo 'Netlify site responds with The Grand Slam markup'
          fi
      - name: Staging API security smoke tests (negative cases only)
        run: node staging/tests/http-auth-smoke.mjs
      - name: Check staging config cannot point to production
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('staging/functions/booking-gateway/index.ts','utf8');if(!s.includes('EXPECTED_STAGING_REF = \"kssxxizhpoxxlbsehymk\"'))process.exit(1);if(/service[_-]?role|sb_secret_/i.test(fs.readFileSync('staging/preview/index.html','utf8')))process.exit(1);"
