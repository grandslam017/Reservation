name: Daily Supabase Database Backup

on:
  schedule:
    # Run every day at 17:00 UTC (00:00 Thailand time / Midnight)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Supabase Backup Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -f "scripts/backup_supabase.js" ]; then
            node scripts/backup_supabase.js
          else
            node backup_supabase.js
          fi

      - name: Commit & Push Backup Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backups/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto backup: $(date +'%Y-%m-%d %H:%M:%S UTC')" && git push)
